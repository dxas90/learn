# https://docs.gitlab.com/ee/ci/yaml/includes.html
include:
  - local: .gitlab-ci-template.yml

stages:
  - initialize
  - build
  - test
  - containerize
  - deployment
  - promote
  - notify

# Initialize stage - runs on all commits to any branch
initialize:
  stage: initialize
  image: golang:alpine
  script:
    - echo "Initializing pipeline for ${CI_COMMIT_REF_NAME}"
    - echo "Commit SHA -> ${CI_COMMIT_SHORT_SHA}"
    - go version
    - apk add --no-cache git ca-certificates
    - go mod download
  artifacts:
    paths:
      - go.mod
      - go.sum
    expire_in: 1 hour

# Build stage - runs on all commits to any branch
build:
  stage: build
  extends: .go-build
  needs:
    - initialize

# Test stage - runs on all commits to any branch
test:
  stage: test
  extends: .go-test
  needs:
    - build

# Notify stage - runs on all commits to any branch
notify:
  stage: notify
  image: alpine:latest
  script:
    - echo "Pipeline completed for ${CI_COMMIT_REF_NAME}"
    - echo "Commit SHA -> ${CI_COMMIT_SHORT_SHA}"
    - echo "Job status -> ${CI_JOB_STATUS}"
  when: always

# Containerize stage - runs only on tags
containerize:
  stage: containerize
  extends: .dockerize
  needs:
    - build
    - test
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

# Deployment (staging) stage - runs only on tags
deployment-staging:
  stage: deployment
  extends: .k8s-deployment
  needs:
    - containerize
  environment:
    name: staging
    deployment_tier: staging
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

# Promote stage - manual job to promote the image from containerize step
promote:
  stage: promote
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl jq
  script:
    # Retrieve the image tag from the containerize job
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / - )
        SANITIZED="${NOSLASH//[^a-zA-Z0-9\-\.]/}"
        SOURCE_VERSION="$SANITIZED"
      else
        echo "Error -> This job should only run on tags"
        exit 1
      fi
    - echo "Promoting image ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION} to production"
    # Login to registries
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$HARBOR_USERNAME" ] && [ -n "$HARBOR_PASSWORD" ]; then
        echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
      fi
    # Pull the image built in containerize stage
    - docker pull ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION}
    # Tag as production/latest
    - docker tag ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION} ${CI_REGISTRY_IMAGE}:production
    - docker tag ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION} ${CI_REGISTRY_IMAGE}:latest
    # Push production tags
    - docker push ${CI_REGISTRY_IMAGE}:production
    - docker push ${CI_REGISTRY_IMAGE}:latest
    # Also push to Harbor if configured
    - |
      if [ -n "$HARBOR_HOST" ] && [ -n "$HARBOR_PROJECT" ]; then
        docker tag ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION} ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}:production
        docker tag ${CI_REGISTRY_IMAGE}:${SOURCE_VERSION} ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}:latest
        docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}:production
        docker push ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}:latest
      fi
    - echo "Image promoted successfully to production"
  needs:
    - containerize
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  environment:
    name: production
    deployment_tier: production
